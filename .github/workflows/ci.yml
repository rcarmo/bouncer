name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Run checks
        run: |
          set -e
          make deps
          make check
          make test
          make test-race
          make test-integration-race
          make vuln
          make test-container
      - name: Retain allocation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: allocation-profiles-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/allocations/
          if-no-files-found: error
          retention-days: 14
