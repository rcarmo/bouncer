<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bouncer – Onboarding</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, system-ui, sans-serif; background: #f5f5f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); padding: 2rem; max-width: 440px; width: 90%; }
  h1 { font-size: 1.5rem; margin-bottom: 0.5rem; text-align: center; }
  p { color: #666; margin-bottom: 1rem; text-align: center; }
  .note { margin-bottom: 1rem; padding: 0.85rem; background: #fafafa; border-radius: 8px; font-size: 0.9rem; color: #444; }
  .note button { margin-top: 0.5rem; }
  button { background: #111; color: #fff; border: none; border-radius: 8px; padding: 0.75rem 1.5rem; font-size: 1rem; cursor: pointer; width: 100%; margin-bottom: 0.75rem; }
  button:hover { background: #333; }
  button.secondary { background: #666; }
  input { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; margin-bottom: 0.75rem; }
  input:focus { outline: none; border-color: #999; box-shadow: 0 0 0 2px rgba(0,0,0,0.08); }
  .otp-group { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.5rem; margin-bottom: 0.75rem; }
  .otp-input { width: 2.4rem; height: 2.8rem; padding: 0; text-align: center; font-size: 1.25rem; font-variant-numeric: tabular-nums; letter-spacing: normal; }
  .name-input { letter-spacing: normal; text-align: left; font-size: 0.95rem; }
  .error { color: #c00; margin-top: 0.5rem; text-align: center; }
  .success { color: #080; margin-top: 0.5rem; text-align: center; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>🔐 Bouncer Setup</h1>
  <p>Enter the admin code and create your passkey.</p>

  <div id="trust-step" class="note">{{TRUST_CONTENT}}</div>

  <div id="token-group">
    <div class="otp-group" id="otp-group" aria-label="Admin code">
      <input class="otp-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1">
      <input class="otp-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 2">
      <input class="otp-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 3">
      <input class="otp-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 4">
      <input class="otp-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 5">
      <input class="otp-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 6">
      <input class="otp-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 7">
      <input class="otp-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 8">
      <input class="otp-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 9">
      <input class="otp-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 10">
      <input class="otp-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 11">
      <input class="otp-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 12">
    </div>
    <input id="token-input" type="hidden" autocomplete="off">
  </div>
  <input id="name-input" class="name-input" type="text" placeholder="Your name (optional)">
  <button id="register-btn">Create Passkey</button>
  <div id="reg-error" class="error hidden"></div>
  <div id="reg-success" class="success hidden"></div>

  <hr style="margin:1rem 0;border:none;border-top:1px solid #eee;">
  <button class="secondary" data-navigate="/login">Already have a passkey? Sign in</button>
</div>

<script type="module" src="/static/onboarding.js"></script>
</body>
</html>
